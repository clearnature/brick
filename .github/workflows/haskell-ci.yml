# Hand-maintained Haskell CI (migrated from the haskell-ci generator).
#
# Toolchain anchoring: haskell-actions/setup@v2.12.1 ships versions.json with
# ghcup 0.2.6.2 (the last release published on GitHub), so every job installs
# GHC/cabal through that exact ghcup.
#
# Cache pattern follows the action's documented model: a `cabal build
# --dry-run` produces dist-newstyle/cache/plan.json, whose hash is the cache
# key; the store is saved right after dependency installation so later
# failures do not lose the cache.

name: Haskell-CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

# A new push to the same branch supersedes the older run.
concurrency:
  group: haskell-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Haskell-CI - Linux - ghc-${{ matrix.ghc }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ghc: ["9.2.8", "9.4.8", "9.6.7", "9.8.4", "9.10.3", "9.12.2", "9.14.1"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up GHC ${{ matrix.ghc }} (ghcup 0.2.6.2 via setup@v2.12.1)
        uses: haskell-actions/setup@v2.12.1
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: "3.16.0.0"

      # Same warning-to-error policy the haskell-ci generator produced.
      - name: Generate cabal.project
        run: |
          GHCV="${{ steps.setup.outputs.ghc-version }}"
          MAJOR="$(echo "$GHCV" | cut -d. -f1)"
          MINOR="$(echo "$GHCV" | cut -d. -f2)"
          WARNERR="-Werror=missing-methods -Werror=missing-fields -Werror=incomplete-patterns -Werror=incomplete-uni-patterns"
          if [ "$((MAJOR * 100 + MINOR))" -ge 904 ]; then
            WARNERR="$WARNERR -Werror=unused-packages"
          fi
          cat > cabal.project <<EOF
          packages: .

          package brick
            flags: +demos
            ghc-options: $WARNERR
          EOF
          cat cabal.project

      - name: Configure
        run: cabal configure --enable-tests --disable-benchmarks --disable-documentation

      - name: Generate build plan (cache key)
        run: cabal build all --dry-run

      - name: Restore cached dependencies
        uses: actions/cache/restore@v4
        id: cache
        env:
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: "${{ env.key }}-plan-${{ hashFiles('dist-newstyle/cache/plan.json') }}"
          restore-keys: |
            ${{ env.key }}-

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: cabal build all --only-dependencies -j4

      - name: Save cached dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build (library, demos, tests)
        run: cabal build all -j4

      - name: Tests
        run: cabal test all --test-show-details=direct

      - name: cabal check
        run: cabal check

      - name: Haddock
        run: cabal haddock all
